[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mehtronome"
version = "0.1.0"
description = "Scale practice with a metronome and pedal harmony"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "PySide6>=6.7,<7", "sounddevice>=0.5,<0.6"]

[project.scripts]
mehtronome = "mehtronome.app:main"

[tool.setuptools.packages.find]
include = ["mehtronome*"]
