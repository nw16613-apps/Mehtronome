<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#122323" />
    <meta name="description" content="Practice scales and arpeggios with a precise metronome and warm harmony backing." />
    <script>
      (() => {
        const available = ['light', 'dark', 'midnight', 'paper', 'plum', 'slate'];
        let saved;
        try { saved = localStorage.getItem('mehtronome-theme'); } catch { /* Use system preference. */ }
        const preview = new URLSearchParams(location.search).get('theme');
        const palette = available.includes(preview) ? preview : available.includes(saved) ? saved : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.palette = palette;
        document.documentElement.dataset.theme = ['dark', 'midnight', 'plum'].includes(palette) ? 'dark' : 'light';
      })();
    </script>
    <title>Mehtronome — practice with harmony</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
